name: admin-ci

on:
  push:
    branches: [main]
    paths: ["admin/**", ".github/workflows/ci-admin.yml"]
  pull_request:
    paths: ["admin/**", ".github/workflows/ci-admin.yml"]

jobs:
  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
